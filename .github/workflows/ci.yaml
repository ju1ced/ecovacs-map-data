name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # These checks depend on repository settings and the brands
          # repository, not on the code in this repository.
          ignore: brands issues topics

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Home Assistant 2026.9 requires Python 3.14.
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - name: Install test requirements
        run: python -m pip install -r requirements_test.txt
      - name: Run pytest
        run: python -m pytest -q
      - name: Run unittest
        run: python -m unittest discover -s tests -p 'test_*.py'
